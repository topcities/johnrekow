  <title>NTP Ticking Clock (Latency-Compensated)</title>
<meta http-equiv="Expires" content="Tue, 04 Dec 1997 21:29:02 GMT">

<!-- ClockCode START -->
<small><FONT><span style="font-family: Arial">The current time from the internet,<br>may be up to 3 seconds slow.</FONT></small><br>
Time from worldtimeapi.org:<br>
<script>
/*
  NTP Ticking Clocks (Latency-Compensated):
  This code cannot talk to NTP/UDP directly from the browser.
  It uses NTP-to-HTTP style endpoints to get current time, and then
  compensates for network/round-trip latency by estimating offset.
*/

const WORLD_TIMEAPI_URL = "https://worldtimeapi.org/api/timezone/Etc/UTC";
const TIME_NOWAPI_URL_BASE = "https://time.now/developer/api/timezone";

// Valid IANA time zone identifiers
const TZ_JERUSALEM = "Asia/Jerusalem";
const TZ_LONDON = "Europe/London";
const TZ_CHICAGO = "America/Chicago";
const TZ_LOS_ANGELES = "America/Los_Angeles";

function formatClock(d, timeZone) {
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone,
    hour12: true,
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric",
    hour: "numeric",
    minute: "2-digit",
    second: "2-digit"
  }).formatToParts(d);

  const map = {};
  for (const p of parts) map[p.type] = p.value;

  return `${map.weekday} ${map.day} ${map.month} ${map.year} at ${map.hour}:${map.minute}:${map.second} ${String(map.dayPeriod).toLowerCase()}`;
}

// Parse server response formats for worldtimeapi.org
async function parseWorldTimeResponse(res) {
  const ct = res.headers.get("content-type") || "";

  let serverDate = null;

  if (ct.includes("application/json")) {
    const data = await res.json();
    if (typeof data.epoch === "number") serverDate = new Date(data.epoch * 1000);
    else if (typeof data.unixtime === "number") serverDate = new Date(data.unixtime * 1000);
    else if (typeof data.time === "string") {
      const d = new Date(data.time);
      if (!isNaN(d.getTime())) serverDate = d;
    } else if (typeof data.datetime === "string") {
      const d = new Date(data.datetime);
      if (!isNaN(d.getTime())) serverDate = d;
    }
  }

  if (!serverDate) {
    const text = (await res.text()).trim();
    const dIso = new Date(text);
    if (!isNaN(dIso.getTime())) serverDate = dIso;
    else if (/^\d+(\.\d+)?$/.test(text)) {
      const seconds = parseFloat(text);
      if (seconds > 1e9 && seconds < 1e11) serverDate = new Date(seconds * 1000);
    }
  }

  if (!serverDate || isNaN(serverDate.getTime())) {
    throw new Error("Unrecognized time response format (worldtimeapi).");
  }

  return serverDate;
}

// Parse server response formats for time.now
async function parseTimeNowResponse(res) {
  const ct = res.headers.get("content-type") || "";

  if (!ct.includes("application/json")) {
    // fall back to text parsing if the API returns text for some reason
    const text = (await res.text()).trim();
    const dIso = new Date(text);
    if (!isNaN(dIso.getTime())) return dIso;
    throw new Error("Unrecognized time response format (time.now).");
  }

  const data = await res.json();

  // time.now returns `unixtime` (seconds) and/or `utc_datetime` (ISO string)
  if (typeof data.unixtime === "number") return new Date(data.unixtime * 1000);

  if (typeof data.utc_datetime === "string") {
    const d = new Date(data.utc_datetime);
    if (!isNaN(d.getTime())) return d;
  }

  if (typeof data.datetime === "string") {
    const d = new Date(data.datetime);
    if (!isNaN(d.getTime())) return d;
  }

  throw new Error("Unrecognized time response format (time.now).");
}

// Fetch "server now" from a given URL while measuring RTT and compensating.
async function syncOnceWorldTime() {
  const t0 = performance.now();

  const res = await fetch(WORLD_TIMEAPI_URL, { cache: "no-store" });
  const t1 = performance.now();

  if (!res.ok) throw new Error("Failed to fetch time: " + res.status);

  const serverDate = await parseWorldTimeResponse(res);

  const rttMs = t1 - t0;
  const midpointPerf = t0 + rttMs / 2;

  const nowPerf = performance.now();
  const nowDateMs = Date.now();

  const baseDateMs = nowDateMs - (nowPerf);
  const midDateMs = baseDateMs + midpointPerf;

  const offsetMs = serverDate.getTime() - midDateMs;

  return { offsetMs, rttMs };
}

// For time.now, we'll call /timezone/Etc/UTC to anchor the epoch similarly.
async function syncOnceTimeNow() {
  const t0 = performance.now();

  // Using UTC timezone keeps parsing logic consistent and avoids needing DST conversions.
  const res = await fetch(`${TIME_NOWAPI_URL_BASE}/Etc/UTC`, { cache: "no-store" });
  const t1 = performance.now();

  if (!res.ok) throw new Error("Failed to fetch time: " + res.status);

  const serverDate = await parseTimeNowResponse(res);

  const rttMs = t1 - t0;
  const midpointPerf = t0 + rttMs / 2;

  const nowPerf = performance.now();
  const nowDateMs = Date.now();

  const baseDateMs = nowDateMs - (nowPerf);
  const midDateMs = baseDateMs + midpointPerf;

  const offsetMs = serverDate.getTime() - midDateMs;

  return { offsetMs, rttMs };
}

async function resyncWithSamples(syncFn, samples = 5) {
  let best = null;

  for (let i = 0; i < samples; i++) {
    try {
      const s = await syncFn();
      if (!best || s.rttMs < best.rttMs) best = s;
    } catch (e) {
      // ignore and try next sample
    }
  }

  if (best) return best.offsetMs;
  return null;
}

// Create two sets of clock labels + text nodes
function makeCityTextNodes() {
  const cities = [
    { tz: TZ_JERUSALEM, node: document.createTextNode("Jerusalem") },
    { tz: TZ_LONDON, node: document.createTextNode("London") },
    { tz: TZ_CHICAGO, node: document.createTextNode("Chicago") },
    { tz: TZ_LOS_ANGELES, node: document.createTextNode("Los Angeles") }
  ];

  const times = cities.map(() => document.createTextNode(""));

  function appendCityLine(cityObj, timeNode) {
    const container = document.createElement("div");
    container.appendChild(cityObj.node);
    container.appendChild(document.createTextNode(": "));
    container.appendChild(timeNode);
    document.body.appendChild(container);
  }

  for (let i = 0; i < cities.length; i++) {
    appendCityLine(cities[i], times[i]);
  }

  return { cities, times };
}

const setA = makeCityTextNodes(); // worldtimeapi
const setB = makeCityTextNodes(); // time.now

// Optional separators (kept minimal)
document.body.insertBefore(document.createElement("hr"), setB.times[0].parentElement);
document.body.insertBefore(document.createTextNode("Time from time.now/developer/api:"), setB.times[0].parentElement);
document.body.insertBefore(document.createElement("br"), setB.times[0].parentElement);

let offsetA = 0;
let offsetB = 0;

function renderFromOffset(times, cities, offsetMs) {
  const estNow = new Date(Date.now() + offsetMs);
  for (let i = 0; i < cities.length; i++) {
    times[i].nodeValue = formatClock(estNow, cities[i].tz);
  }
}

(async function start() {
  // Initial syncs
  const a = await resyncWithSamples(syncOnceWorldTime, 5);
  if (typeof a === "number") offsetA = a;

  const b = await resyncWithSamples(syncOnceTimeNow, 5);
  if (typeof b === "number") offsetB = b;

  renderFromOffset(setA.times, setA.cities, offsetA);
  renderFromOffset(setB.times, setB.cities, offsetB);

  // Periodic resync + render
  setInterval(async () => {
    const a2 = await resyncWithSamples(syncOnceWorldTime, 5);
    if (typeof a2 === "number") offsetA = a2;

    const b2 = await resyncWithSamples(syncOnceTimeNow, 5);
    if (typeof b2 === "number") offsetB = b2;

    renderFromOffset(setA.times, setA.cities, offsetA);
    renderFromOffset(setB.times, setB.cities, offsetB);
  }, 60000);

  // Fast ticking display
  setInterval(() => {
    renderFromOffset(setA.times, setA.cities, offsetA);
    renderFromOffset(setB.times, setB.cities, offsetB);
  }, 250);
})();
</script>
