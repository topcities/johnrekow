</SCRIPT> 
  <title>Quicksurf 77d -- Section 18 -- TOTP (RFC 6238)</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      margin: 24px;
      line-height: 1.35;
      max-width: 820px;
    }
    label { display: block; margin: 12px 0 6px; font-weight: 600; }
    input, select, button, textarea {
      font-size: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(127,127,127,.35);
      background: rgba(127,127,127,.08);
      color: inherit;
      width: 100%;
      box-sizing: border-box;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 720px) { .row { grid-template-columns: 1fr; } }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
    button { cursor: pointer; width: auto; }
    .card {
      border-radius: 14px;
      padding: 16px;
      border: 1px solid rgba(127,127,127,.25);
      background: rgba(127,127,127,.06);
      margin-top: 16px;
    }
    .codebox {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 28px;
      letter-spacing: 0.08em;
      padding: 12px 12px;
      border-radius: 12px;
      background: rgba(0,0,0,.08);
      border: 1px solid rgba(127,127,127,.25);
      display: inline-block;
      min-width: 240px;
      text-align: center;
    }
    .muted { opacity: .8; font-size: 13px; }
    .bigline { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    .progress {
      height: 10px;
      border-radius: 999px;
      background: rgba(127,127,127,.2);
      overflow: hidden;
      margin-top: 10px;
      width: 100%;
      max-width: 420px;
    }
    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4f8cff, #7cffcb);
      transition: width 100ms linear;
    }
    textarea { resize: vertical; min-height: 86px; }
    .err {
      color: #d14;
      margin-top: 10px;
      font-weight: 700;
    }
    .ok {
      color: #148b3f;
      margin-top: 10px;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <h1 style="margin: 0 0 10px;">Section 18: TOTP Generator (RFC 6238) -- Single HTML File</h1>
  <div class="muted">
    Enter a Base32 secret key, choose algorithm/digits/period, and it will compute the current TOTP using WebCrypto.
  </div>

  <div class="card">
    <label for="secret">Secret key (Base32)</label>
    <input id="secret" type="text" placeholder="e.g. JBSWY3DPEHPK3PXP" autocomplete="off" spellcheck="false" />

    <div class="row">
      <div>
        <label for="algo">Algorithm</label>
        <select id="algo">
          <option value="SHA-1" selected>SHA-1</option>
          <option value="SHA-256">SHA-256</option>
          <option value="SHA-512">SHA-512</option>
        </select>
      </div>
      <div>
        <label for="digits">Digits</label>
        <select id="digits">
          <option value="6" selected>6</option>
          <option value="7">7</option>
          <option value="8">8</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label for="period">Period (seconds)</label>
        <select id="period">
          <option value="15">15</option>
          <option value="30" selected>30</option>
          <option value="60">60</option>
          <option value="90">90</option>
        </select>
      </div>
      <div>
        <label for="timeOffset">Optional time offset (seconds)</label>
        <input id="timeOffset" type="number" step="1" value="0" />
      </div>
    </div>

    <div class="actions">
      <button id="setNow" type="button">Start / Update</button>
      <button id="stop" type="button" style="background: transparent;">Stop</button>
      <button id="clear" type="button" style="background: transparent;">Clear</button>
    </div>

    <div id="msg" class="muted"></div>
    <div id="error" class="err" style="display:none;"></div>
  </div>

  <div class="card">
    <div class="bigline">
      <div>
        <div class="muted">Current TOTP</div>
        <div id="totp" class="codebox">—</div>
      </div>
      <div>
        <div class="muted">Time remaining</div>
        <div style="font-size: 18px; font-weight: 700;" id="remaining">—</div>
        <div class="progress" aria-hidden="true">
          <div class="bar" id="bar"></div>
        </div>
        <div class="muted" style="margin-top:8px;" id="counterLine">Counter: —</div>
      </div>
    </div>
  </div>

  <script>
    // ---- RFC 6238 Implementation (TOTP) using WebCrypto ----
    // T = (currentUnixTime + offset) / period, truncated to integer.
    // HOTP: HMAC(key, T) -> dynamic truncation -> mod 10^digits
    // Then format with leading zeros to the chosen digit length.

    const elSecret = document.getElementById('secret');
    const elAlgo = document.getElementById('algo');
    const elDigits = document.getElementById('digits');
    const elPeriod = document.getElementById('period');
    const elOffset = document.getElementById('timeOffset');

    const elTotp = document.getElementById('totp');
    const elRemaining = document.getElementById('remaining');
    const elBar = document.getElementById('bar');
    const elCounterLine = document.getElementById('counterLine');
    const elMsg = document.getElementById('msg');
    const elError = document.getElementById('error');

    const btnStart = document.getElementById('setNow');
    const btnStop = document.getElementById('stop');
    const btnClear = document.getElementById('clear');

    let timer = null;

    function showError(text) {
      elError.textContent = text;
      elError.style.display = 'block';
    }
    function clearError() {
      elError.textContent = '';
      elError.style.display = 'none';
    }

    function normalizeBase32(str) {
      // RFC 4648 Base32 alphabet. Commonly secrets have spaces or hyphens.
      return (str || '')
        .toUpperCase()
        .replace(/[\s-]/g, '')
        .replace(/=+$/g, ''); // strip padding
    }

    function base32ToBytes(base32) {
      // Uses RFC 4648 alphabet: A-Z2-7
      // Returns Uint8Array
      const s = normalizeBase32(base32);
      if (!s) throw new Error('Secret key is empty.');

      const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
      let bits = 0;
      let value = 0;
      const out = [];

      for (let i = 0; i < s.length; i++) {
        const c = s[i];
        const idx = alphabet.indexOf(c);
        if (idx === -1) {
          throw new Error('Invalid Base32 character: "' + c + '". Allowed: A-Z and 2-7 (padding optional).');
        }
        value = (value << 5) | idx;
        bits += 5;

        while (bits >= 8) {
          bits -= 8;
          out.push((value >> bits) & 0xFF);
        }
      }
      return new Uint8Array(out);
    }

    function pow10(n) {
      // n is small (digits: 6..8)
      let x = 1;
      for (let i = 0; i < n; i++) x *= 10;
      return x;
    }

    function bigIntTo8ByteBE(num) {
      // counter is 64-bit unsigned in RFC; JS uses BigInt safely.
      let x = BigInt(num);
      const buf = new Uint8Array(8);
      for (let i = 7; i >= 0; i--) {
        buf[i] = Number(x & 0xFFn);
        x >>= 8n;
      }
      return buf;
    }

    async function computeTOTP(secretBase32, algoName, digits, periodSec, timeOffsetSec) {
      const keyBytes = base32ToBytes(secretBase32);

      // counter T
      const nowMs = Date.now();
      const nowSec = Math.floor(nowMs / 1000);
      const t = BigInt(Math.floor(nowSec + (timeOffsetSec || 0))) / BigInt(periodSec);

      // HOTP with HMAC
      const key = await crypto.subtle.importKey(
        'raw',
        keyBytes,
        { name: 'HMAC', hash: { name: algoName } },
        false,
        ['sign']
      );

      const msg = bigIntTo8ByteBE(t);

      const hmacSig = new Uint8Array(
        await crypto.subtle.sign('HMAC', key, msg)
      );

      // Dynamic truncation:
      // offset = last nibble of hmacSig
      const offset = hmacSig[hmacSig.length - 1] & 0x0f;

      // Take 4 bytes starting at offset, mask most significant bit
      let binCode =
        ((hmacSig[offset] & 0x7f) << 24) |
        ((hmacSig[offset + 1] & 0xff) << 16) |
        ((hmacSig[offset + 2] & 0xff) << 8) |
        (hmacSig[offset + 3] & 0xff);

      const mod = pow10(digits);
      const otp = (binCode % mod).toString().padStart(digits, '0');

      // Remaining time
      const elapsed = (nowSec + (timeOffsetSec || 0)) % periodSec;
      const remaining = periodSec - elapsed;

      return { otp, remaining, counter: t.toString() };
    }

    async function refresh() {
      clearError();
      elMsg.textContent = '';

      const secret = elSecret.value;
      const algo = elAlgo.value;
      const digits = parseInt(elDigits.value, 10);
      const period = parseInt(elPeriod.value, 10);
      const offset = parseInt(elOffset.value, 10) || 0;

      try {
        const { otp, remaining, counter } = await computeTOTP(secret, algo, digits, period, offset);
        elTotp.textContent = otp;
        elRemaining.textContent = remaining + 's';
        elCounterLine.textContent = 'Counter: ' + counter;

        const pct = Math.max(0, Math.min(1, (period - remaining) / period));
        elBar.style.width = Math.round(pct * 100) + '%';
      } catch (e) {
        elTotp.textContent = '—';
        elRemaining.textContent = '—';
        elCounterLine.textContent = 'Counter: —';
        elBar.style.width = '0%';
        showError(e && e.message ? e.message : String(e));
      }
    }

    function start() {
      if (timer) return;
      refresh();
      timer = setInterval(refresh, 250);
    }

    function stop() {
      if (!timer) return;
      clearInterval(timer);
      timer = null;
    }

    btnStart.addEventListener('click', () => start());
    btnStop.addEventListener('click', () => stop());
    btnClear.addEventListener('click', () => {
      stop();
      clearError();
      elSecret.value = '';
      elTotp.textContent = '—';
      elRemaining.textContent = '—';
      elCounterLine.textContent = 'Counter: —';
      elBar.style.width = '0%';
      elMsg.textContent = '';
    });

    // Optional: auto-start when fields change (lightly debounced)
    let changeTimer = null;
    function onInputChange() {
      if (changeTimer) clearTimeout(changeTimer);
      changeTimer = setTimeout(() => {
        if (timer) refresh();
      }, 150);
    }
    [elSecret, elAlgo, elDigits, elPeriod, elOffset].forEach(x => {
      x.addEventListener('input', onInputChange);
      x.addEventListener('change', onInputChange);
    });
  </script>
</body>
</html>
